name: Apply reviewed refresh update
on:
  push:
    branches: ['fix/six-hour-manual-refresh-20261117']
    paths: ['.github/workflows/apply-refresh-update.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact locally tested patch
        env:
          PATCH: 
        run: |
          python - <<'PY'
          import os,base64,gzip,hashlib,subprocess
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(patch).hexdigest()=='b4a6ab7329e3461367fec97a9fc6d4acdb52e5e3dfde10fd7cad0bae238a39ad'
          subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          PY
      - run: npm test
      - name: Commit tested application files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md package.json src tests
          git commit -m 'Support six-hour public cache and explicit manual refresh safely'
          git push origin HEAD:refs/heads/fix/six-hour-manual-refresh-20261117
